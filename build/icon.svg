<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 底色：深色渐变，跟应用的 dark 主题同一家族 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#2a3350"/>
      <stop offset="55%" stop-color="#161b29"/>
      <stop offset="100%" stop-color="#0b0e15"/>
    </linearGradient>
    <!-- 柱色：从浅到应用主色，最右那根最亮（当前正在涨的那个） -->
    <linearGradient id="bar1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3f62b8"/>
      <stop offset="100%" stop-color="#6b8ede"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4a76d6"/>
      <stop offset="100%" stop-color="#89a8f0"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="100%" stop-color="#b6ccff"/>
    </linearGradient>
    <!-- 顶部一道极淡的高光，让圆角矩形有体积感 -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="92" y="92" width="840" height="840" rx="188" ry="188"/>
    </clipPath>
  </defs>

  <!-- 底板 -->
  <rect x="92" y="92" width="840" height="840" rx="188" ry="188" fill="url(#bg)"/>
  <rect x="92" y="92" width="840" height="840" rx="188" ry="188" fill="url(#sheen)"/>
  <!-- 一圈内描边，避免在浅色背景上边缘糊掉 -->
  <rect x="93" y="93" width="838" height="838" rx="187" ry="187"
        fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

  <g clip-path="url(#round)">
    <!-- 极淡的横向参考线：暗示「同一条基准上比高低」 -->
    <line x1="272" y1="546" x2="752" y2="546" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
    <line x1="272" y1="438" x2="752" y2="438" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>

    <!-- 三根柱，底边对齐 694 -->
    <rect x="320" y="546" width="96" height="148" rx="48" ry="48" fill="url(#bar1)"/>
    <rect x="464" y="438" width="96" height="256" rx="48" ry="48" fill="url(#bar2)"/>
    <rect x="608" y="330" width="96" height="364" rx="48" ry="48" fill="url(#bar3)"/>

    <!-- 基准线 -->
    <line x1="292" y1="712" x2="732" y2="712" stroke="#ffffff" stroke-opacity="0.22"
          stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
