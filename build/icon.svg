<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 账号监控 · 应用图标
       一个「数据卡」：上面是读数，下面是走势。图形只讲一件事——把号看住。 -->
  <defs>
    <linearGradient id="bg" x1="0.12" y1="0" x2="0.86" y2="1">
      <stop offset="0%" stop-color="#5C9DFF"/>
      <stop offset="52%" stop-color="#2F5BF0"/>
      <stop offset="100%" stop-color="#1E33C4"/>
    </linearGradient>
    <linearGradient id="card" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E4EDFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.24" cy="0.14" r="0.85">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 卡片浮在底板上，靠一层很轻的投影拉开层次 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0A1F6B" flood-opacity="0.28"/>
    </filter>
    <clipPath id="round"><rect x="100" y="100" width="824" height="824" rx="184"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#glow)"/>

  <g clip-path="url(#round)">
    <rect x="224" y="252" width="576" height="520" rx="78" fill="url(#card)" filter="url(#shadow)"/>
    <!-- 读数：一条淡标签 + 一个大数字块 -->
    <rect x="300" y="330" width="148" height="26" rx="13" fill="#8FA5D6"/>
    <rect x="300" y="382" width="228" height="60" rx="30" fill="#16296F"/>
    <!-- 走势 -->
    <polyline points="300,650 408,556 486,606 688,424" fill="none" stroke="#2F5BF0"
              stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="688" cy="424" r="46" fill="#2F5BF0"/>
  </g>

  <rect x="101" y="101" width="822" height="822" rx="183" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"/>
</svg>
